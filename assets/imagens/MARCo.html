<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);">
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #2a78d6;"></span>Índice de preço acumulado (hoje = 100)</span>
</div>
<div style="position: relative; width: 100%; height: 320px;">
  <canvas id="marcoChart" role="img" aria-label="Gráfico de barras mostrando o aumento acumulado previsto dos preços da oferta MARCo entre 2026 e 2031: 100, 130, 152, 178, 208, 212, correspondendo a um aumento de 30% no ano 1, 16,96% nos anos 2 a 4, e 2% no ano 5">Índice de preço: hoje 100, ano 1: 130, ano 2: 152, ano 3: 178, ano 4: 208, ano 5: 212</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('marcoChart'), {
  type: 'bar',
  data: {
    labels: ['Hoje\n(2026)', 'Ano 1\n+30%', 'Ano 2\n+16,96%', 'Ano 3\n+16,96%', 'Ano 4\n+16,96%', 'Ano 5\n+2% (IPC)'],
    datasets: [{
      label: 'Índice de preço',
      data: [100, 130, 152, 178, 208, 212],
      backgroundColor: '#2a78d6',
      borderRadius: 4,
      maxBarThickness: 44
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => 'Índice: ' + ctx.parsed.y
        }
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        max: 230,
        ticks: { color: '#898781', stepSize: 50 },
        grid: { color: '#e1e0d9' },
        title: { display: true, text: 'Índice (hoje = 100)', color: '#52514e', font: { size: 12 } }
      },
      x: {
        ticks: { color: '#898781', font: { size: 11 } },
        grid: { display: false }
      }
    }
  }
});
</script>
